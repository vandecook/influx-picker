name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      influxdb2:
        image: influxdb:2.7
        ports:
          - 8086:8086
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: ci
          DOCKER_INFLUXDB_INIT_PASSWORD: ci-password-only-for-tests
          DOCKER_INFLUXDB_INIT_ORG: ci
          DOCKER_INFLUXDB_INIT_BUCKET: ha
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ci-token-only-for-tests
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Lint
        run: ruff check .
      - name: Tests (unit, golden, InfluxDB 2 integration)
        env:
          INFLUXDB_V2_URL: http://127.0.0.1:8086
          INFLUXDB_V2_TOKEN: ci-token-only-for-tests
          INFLUXDB_V2_ORG: ci
          INFLUXDB_V2_BUCKET: ha
        run: pytest -v -rs

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Repository topics and description are set by the maintainer in the
          # GitHub UI; brand icons are not submitted yet.
          ignore: brands topics description
